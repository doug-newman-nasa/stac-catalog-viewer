name: Test Runner

# Trigger the workflow on any pull request targeting the main branch
on:
  pull_request:
    branches: [ main ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out your repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up the language environment (e.g., Node.js)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Specify your required version

      # Step 3: Install project dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Execute the test suite
      - name: Run tests
        run: npm test -- --run
